##### ZENWRITTEN DARK (zenbones family) #####
# Do NOT `run-shell` upstream extras/tmux/zenwritten_dark.tmux: that file is generated
# with fg and bg swapped (it paints the bar with the palette's *foreground* #BBBBBB),
# which is why every *bones tmux extra looks inverted.
#
# Every value below is a real zenwritten_dark colour (extras/kitty/zenwritten_dark.conf
# + lua/lualine/themes/zenwritten_dark.lua), so this bar and the nvim statusline are the
# same greys. Zenwritten is the zero-hue/zero-saturation zenbones variant: contrast-only,
# no accent colour, state shown by brightness.
#
#   c (the fill/bar)      bg #191919   fg #8E8E8E    — same bg as ghostty, so the bar sits flush
#   b (host, date)        bg #2E2E2E   fg #BBBBBB
#   a (session, clock)    bg #404040   fg #C9C9C9   also the current window
#   inverted (prefix/bell) bg #BBBBBB   fg #191919
#   pane border #3D3839 / #BBBBBB     mode/message bg #404040
#
# Separators: lualine's defaults (nvim/lua/plugins/lualine.lua sets none, so the built-ins
# apply). Left-aligned sections — including the window list — flow rightwards with
#  U+E0B0 and  U+E0B1; only the right-aligned clock/host block reverses, with
#  U+E0B2 and  U+E0B3, exactly as lualine does for sections x/y/z.
#
# NB: inside a #{...} conditional, `#D`/`#W`/`#I`/`#S`/`#h` are format directives, so a
# hex colour there must be escaped as `##404040` or `#D...` expands to the pane id.
#
# Must stay after the tpm run line so nothing a plugin sets can win.

# --- clear tmux-onedark-theme leftovers -------------------------------------------
# The plugin is commented out above, but options it set survive in an already-running
# server, and these are not ones this file overwrites: status-bg/status-fg (#282c34,
# a cool grey) still tint the bar, and window-style/window-active-style recolour pane
# *contents*. Unset them so no restart is needed.
set -gu status-bg
set -gu status-fg
setw -gu window-style
setw -gu window-active-style
setw -gu window-status-style
setw -gu window-status-current-style
# ----------------------------------------------------------------------------------

set -g status-style "fg=#8E8E8E,bg=#191919"

# session name; inverts to a bright block while the prefix is held
set -g status-left "#[fg=#{?client_prefix,##191919,##C9C9C9},bg=#{?client_prefix,##BBBBBB,##404040},bold] #S #[fg=#{?client_prefix,##BBBBBB,##404040},bg=#191919,nobold]"
set -g status-left-length 30

set -g status-right "#[fg=#2E2E2E,bg=#191919]#[fg=#BBBBBB,bg=#2E2E2E] #h #[fg=#8E8E8E]#[fg=#BBBBBB] %d/%m #[fg=#404040,bg=#2E2E2E]#[fg=#C9C9C9,bg=#404040,bold]  %R "
set -g status-right-length 60

# Window list: arrows all point right. The current window opens with  drawn in the
# bar colour *over* the block bg (the notch) and closes with  in the block colour
# over the bar — never , which is the right-aligned sections' separator.
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#8E8E8E,bg=#191919] #I #[fg=#3D3839]#[fg=#8E8E8E] #W #[fg=#3D3839]"
setw -g window-status-current-format "#[fg=#191919,bg=#404040]#[fg=#C9C9C9,bg=#404040,bold] #I #[fg=#8E8E8E,nobold]#[fg=#C9C9C9,bold] #W #[fg=#404040,bg=#191919,nobold]"
setw -g window-status-activity-style "fg=#C9C9C9,bg=#191919,bold"
setw -g window-status-bell-style "fg=#191919,bg=#BBBBBB,bold"

set -g pane-border-style "fg=#3D3839"
set -g pane-active-border-style "fg=#BBBBBB"

set -g message-style "fg=#C9C9C9,bg=#404040"
set -g message-command-style "fg=#C9C9C9,bg=#404040"
set -g mode-style "fg=#C9C9C9,bg=#404040"

set -g display-panes-colour "#404040"
set -g display-panes-active-colour "#BBBBBB"
set -g clock-mode-colour "#BBBBBB"

# The bar bg is ghostty's own background (#191919), so it already reads as flush. For real
# transparency (background-opacity 0.94 showing through) swap bg=#191919 for bg=default in
# status-style and window-status-format — the triangles need a real bg, so the blocks stay.
# set -g status-style "fg=#8E8E8E,bg=default"
# setw -g window-status-format "#[fg=#8E8E8E,bg=default] #I #[fg=#3D3839]#[fg=#8E8E8E] #W #[fg=#3D3839]"
